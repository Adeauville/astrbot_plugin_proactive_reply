name: astrbot_plugin_proactive_reply
display_name: 智能自主回复
short_desc: 上下文延续判断、关键词触发、免打扰时段、独立开关与运行日志
desc: |-
  为 AstrBot 提供「主动回复」能力：

  - 私聊 / 群聊自主回复独立开关，群聊支持识别非 @ 消息，并按概率/关键词自主决定是否回复；
  - 上下文延续判断：让模型自动识别消息是否在与机器人对话，无关的消息不回复；
    刚回复过的人再次发言视为对话延续，直接回复、不漏回；
    判断提示词可在配置面板自定义修改（默认内置，可识别重复话题避免重复回复）；
    模型误输出「判定确认文本」（如“是，这条消息是在与我继续对话。”）会被自动识别丢弃，不会误发；
  - 自动联系上下文回复（按会话维度独立维护记忆，仅记录机器人参与过的对话；
    历史以明文拼入 prompt，兼容所有模型提供商）；
  - 关键词触发回复 + 群聊自主回复概率；
  - 免打扰时间段（格式 "22:00-9:00"，支持跨天）；免打扰时段内可分别控制「自主回复」与「@回复」是否放行；
  - 插件运行日志收集（写入 AstrBot 日志 logs/astrbot.log 便于统一查看，插件目录另保留最近 3 份文件日志）；
    内置防重复机制，避免对同一条消息重复回复；
  - v1.7.0 起接通 on_llm_request / on_llm_response 钩子链：
    lili_state 等通过钩子注入人设/状态的插件现在能正常作用于本插件发出的请求，
    群聊自主回复不再丢失人设；钩子不可用时自动降级为旧行为。

  管理指令：
  - /autoreply_status   查看当前状态与配置摘要
  - /autoreply_log 行数 查看最近 N 行插件日志（默认 30 行）
author: Doubao
version: 1.7.5
repo: https://github.com/AstrBotDevs/AstrBot
support_platforms:
